name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  build-arm64:
    name: build-arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: mkdir -p dist && GOOS=darwin GOARCH=arm64 go build -o dist/mailhub-darwin-arm64 ./cmd/mailhub
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mailhub-darwin-arm64
          path: dist/mailhub-darwin-arm64

  build-intel:
    name: build-intel
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: mkdir -p dist && GOOS=darwin GOARCH=amd64 go build -o dist/mailhub-darwin-amd64 ./cmd/mailhub
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mailhub-darwin-amd64
          path: dist/mailhub-darwin-amd64
