name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...

  build-arm64:
    name: build-arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: mkdir -p dist && GOOS=darwin GOARCH=arm64 go build -o dist/mailhub-darwin-arm64 ./cmd/mailhub
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailhub-darwin-arm64
          path: dist/mailhub-darwin-arm64

  build-intel:
    name: build-intel
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: mkdir -p dist && GOOS=darwin GOARCH=amd64 go build -o dist/mailhub-darwin-amd64 ./cmd/mailhub
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mailhub-darwin-amd64
          path: dist/mailhub-darwin-amd64

  homebrew:
    name: homebrew
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap current checkout
        run: brew tap private-mailhub/cli "file://$GITHUB_WORKSPACE"
      - name: Trust formula
        run: brew trust --formula private-mailhub/cli/mailhub
      - name: Audit formula
        run: brew audit --strict private-mailhub/cli/mailhub
      - name: Build formula
        run: brew install --build-from-source private-mailhub/cli/mailhub
      - name: Test formula
        run: brew test private-mailhub/cli/mailhub
